<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Muscle</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-title" content="Muscle">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <button class="nav-btn active" onclick="showPage('train')">訓練</button>
  <button class="nav-btn" onclick="showPage('nutrition')">飲食</button>
  <button class="nav-btn" onclick="showPage('water')">喝水</button>
  <button class="nav-btn" onclick="showPage('supps')">補充品</button>
</nav>

<!-- TRAINING PAGE -->
<div class="page active" id="page-train">
  <p class="page-title">training log</p>

  <div class="week-bar" id="weekBar"></div>

  <div class="day-tabs">
    <button class="day-tab active" onclick="selectDay('A')">A 推日</button>
    <button class="day-tab" onclick="selectDay('B')">B 腿日</button>
    <button class="day-tab" onclick="selectDay('C')">C 拉日</button>
  </div>

  <div id="exerciseList"></div>

  <div class="reset-row">
    <button class="btn-reset" onclick="resetToday()">清除今日紀錄</button>
  </div>
</div>

<!-- NUTRITION PAGE -->
<div class="page" id="page-nutrition">
  <p class="page-title">nutrition</p>

  <div class="protein-total">
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div>
        <div style="font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-bottom:4px">今日蛋白質</div>
        <div class="protein-big" id="proteinDisplay">0 <span>/ 115g</span></div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:var(--muted);font-family:var(--font-mono)">目標</div>
        <div style="font-size:20px;font-weight:700;font-family:var(--font-mono);color:var(--muted)">115g</div>
      </div>
    </div>
    <div class="protein-bar-bg"><div class="protein-bar-fill" id="proteinBar" style="width:0%"></div></div>
    <div class="protein-nums"><span>0g</span><span>57g</span><span>115g</span></div>
  </div>

  <div id="macroSummary" class="macro-summary"></div>

  <div class="sec-title">各餐紀錄</div>
  <div id="mealList"></div>

  <div class="reset-row">
    <button class="btn-reset" onclick="resetProtein()">清除今日蛋白質紀錄</button>
  </div>
</div>

<!-- WATER PAGE -->
<div class="page" id="page-water">
  <p class="page-title">hydration</p>

  <div class="water-display">
    <div class="water-big" id="waterDisplay">0 <span>/ 2000 ml</span></div>
    <div style="font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--font-mono)">目標 1500–2000 ml</div>
  </div>

  <div class="water-cups" id="waterCups"></div>

  <div class="water-btns">
    <button class="water-btn" onclick="addWater(150)">+150 ml<br><span style="color:var(--muted)">小杯</span></button>
    <button class="water-btn" onclick="addWater(250)">+250 ml<br><span style="color:var(--muted)">一杯</span></button>
    <button class="water-btn" onclick="addWater(500)">+500 ml<br><span style="color:var(--muted)">大瓶</span></button>
  </div>

  <div class="sec-title" style="margin-top:20px">時間點提醒</div>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:12px;color:var(--muted);line-height:2;">
    起床後 → 一杯 250ml<br>
    肌酸配水 → 再一杯 250ml<br>
    訓練中 → 組間小口補，約 300–400ml<br>
    乳清後 → 再一杯 250ml
  </div>

  <div class="reset-row">
    <button class="btn-reset" onclick="resetWater()">清除今日喝水紀錄</button>
  </div>
</div>

<!-- SUPPLEMENTS PAGE -->
<div class="page" id="page-supps">
  <p class="page-title">supplements</p>

  <div class="sec-title">今日補充品</div>
  <div id="suppList"></div>

  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:8px;">
    <div style="font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-bottom:8px">BCAA 說明</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.7">已喝乳清的情況下，BCAA 額外效益低。建議停掉，省下來買更多乳清或食物。</div>
  </div>

  <div class="reset-row">
    <button class="btn-reset" onclick="resetSupps()">清除今日補充品紀錄</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- FOOD VISION MODAL -->
<div class="modal-overlay" id="foodModal">
  <div class="modal-box">

    <!-- Step 1: preview + text supplement -->
    <div id="foodModalPrep" style="display:none">
      <img id="foodPrepThumb" class="food-thumb" src="" alt="food preview">
      <div style="font-size:11px;color:var(--muted);font-family:var(--font-mono);margin:10px 0 6px">補充說明（選填）</div>
      <textarea id="foodSupplementText" class="food-note-input" placeholder="例：大碗、有加蛋、醬汁另外算"></textarea>
      <div class="modal-btns">
        <button class="btn-sm btn-ghost" onclick="hideFoodModal()">取消</button>
        <button class="btn-sm btn-accent" onclick="startFoodAnalysis()">開始分析</button>
      </div>
    </div>

    <!-- Step 2: loading -->
    <div class="modal-loading" id="foodModalLoading" style="display:none">
      <div class="spinner"></div>
      <div style="font-size:12px;color:var(--muted);margin-top:14px;font-family:var(--font-mono)">AI 分析中...</div>
    </div>

    <!-- Step 3: results -->
    <div id="foodModalResult" style="display:none">
      <img id="foodThumb" class="food-thumb" src="" alt="food photo">
      <div id="foodsList" class="foods-list"></div>
      <div id="foodConfidence" class="food-confidence" style="margin-bottom:12px"></div>
      <div class="macro-inputs">
        <div class="macro-input-item">
          <div class="macro-label" style="color:var(--accent)">蛋白質</div>
          <input type="number" id="foodProteinInput" class="macro-val-input">
          <div class="macro-unit">g</div>
        </div>
        <div class="macro-input-item">
          <div class="macro-label" style="color:var(--accent2)">碳水</div>
          <input type="number" id="foodCarbsInput" class="macro-val-input">
          <div class="macro-unit">g</div>
        </div>
        <div class="macro-input-item">
          <div class="macro-label" style="color:var(--accent3)">脂肪</div>
          <input type="number" id="foodFatInput" class="macro-val-input">
          <div class="macro-unit">g</div>
        </div>
      </div>
      <div class="modal-btns">
        <button class="btn-sm btn-ghost" onclick="hideFoodModal()">取消</button>
        <button class="btn-sm btn-accent" id="foodConfirmBtn" onclick="confirmFoodAnalysis()">記錄</button>
      </div>
    </div>

  </div>
</div>

<input type="file" id="foodPhotoInput" accept="image/*" capture="environment" style="display:none">

<script type="module" src="js/app.js"></script>
</body>
</html>
